<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding Puzzle 5x5 Pro</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: radial-gradient(circle at center, #1e1e2f 0%, #121212 100%); 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: 15px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 { 
            margin: 0 0 10px 0; 
            font-size: 26px; 
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(45deg, #f1c40f, #e74c3c, #3498db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .stats-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 12px;
        }

        .stat-box {
            font-size: 14px; 
            font-weight: bold; 
            color: #f1c40f; 
            background: rgba(34, 34, 34, 0.8); 
            padding: 6px 14px; 
            border-radius: 15px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #puzzle { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 6px; 
            max-width: 350px; 
            width: 100%;
            margin: 0 auto 15px auto; 
            background: rgba(20, 20, 20, 0.9); 
            padding: 12px; 
            border-radius: 16px; 
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        .tile { 
            aspect-ratio: 1; 
            color: #fff; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 20px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            user-select: none; 
            box-shadow: 
                inset 0px 0px 8px rgba(255, 255, 255, 0.4), 
                0px 4px 6px rgba(0, 0, 0, 0.3);       
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            transition: transform 0.1s ease;
        }

        .tile:active {
            transform: scale(0.95);
        }

        .color-blue { background: linear-gradient(135deg, #3498db, #2980b9); }
        .color-green { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .color-yellow { background: linear-gradient(135deg, #f1c40f, #f39c12); }
        .color-purple { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .color-red { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        
        .tile.empty { 
            background: #181818; 
            cursor: default; 
            box-shadow: none; 
        }

        button { 
            padding: 12px 28px; 
            font-size: 16px; 
            border: none; 
            background: linear-gradient(135deg, #2ecc71, #27ae60); 
            color: white; 
            border-radius: 30px; 
            cursor: pointer; 
            font-weight: bold; 
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
            transition: all 0.2s ease;
        }

        button:active {
            transform: scale(0.95);
        }

        #win-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1e1e2f;
            padding: 25px 30px;
            border-radius: 20px;
            border: 2px solid #f1c40f;
            max-width: 280px;
            width: 85%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .modal-content h2 { margin-top: 0; color: #f1c40f; font-size: 24px; }
        .modal-content p { margin: 8px 0; font-size: 15px; color: #ddd; }
        .highlight-score { color: #2ecc71; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div>
        <h1>SLIDING PUZZLE 5x5</h1>
        <div class="stats-container">
            <div class="stat-box">⏱️ <span id="timer">00:00</span></div>
            <div class="stat-box">🔄 <span id="moves">0</span> Langkah</div>
        </div>
    </div>

    <div id="puzzle"></div>
    <button onclick="shuffle()">Acak Game</button>

    <div id="win-modal">
        <div class="modal-content">
            <h2>🎉 SELAMAT!</h2>
            <p>Waktu: <span id="final-time" style="color:#f1c40f; font-weight:bold;">00:00</span></p>
            <p>Total Langkah: <span id="final-moves" style="font-weight:bold;">0</span></p>
            <p>Skor Anda:</p>
            <div class="highlight-score" id="final-score">0 Poin</div>
            <br>
            <button onclick="shuffle(); closeModal();">Main Lagi</button>
        </div>
    </div>

    <script>
        const size = 5;
        let tiles = Array.from({length: size * size - 1}, (_, i) => i + 1).concat("");
        const puzzle = document.getElementById("puzzle");
        
        let startTime;
        let timerInterval;
        let gameActive = false;
        let moveCount = 0;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playClick() {
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(500, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
                
                gainNode.gain.setValueAtTime(0.35, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.04);
            } catch (e) {}
        }

        function getColorClass(num) {
            if (num === "") return "empty";
            if (num <= 5) return "color-blue";
            if (num <= 10) return "color-green";
            if (num <= 15) return "color-yellow";
            if (num <= 20) return "color-purple";
            return "color-red";
        }

        function render() {
            puzzle.innerHTML = "";
            tiles.forEach((tile, index) => {
                const div = document.createElement("div");
                div.className = `tile ${getColorClass(tile)}`;
                div.innerText = tile;
                if (tile !== "") div.onclick = () => move(index);
                puzzle.appendChild(div);
            });
        }

        function move(index) {
            if (!gameActive) return;
            const emptyIndex = tiles.indexOf("");
            const row = Math.floor(index / size), col = index % size;
            const eRow = Math.floor(emptyIndex / size), eCol = emptyIndex % size;
            
            if (Math.abs(row - eRow) + Math.abs(col - eCol) === 1) {
                [tiles[index], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[index]];
                moveCount++;
                document.getElementById("moves").innerText = moveCount;
                playClick(); 
                render();
                setTimeout(checkWin, 100);
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsedTime = Date.now() - startTime;
                const minutes = Math.floor(elapsedTime / 60000);
                const seconds = Math.floor((elapsedTime % 60000) / 1000);
                document.getElementById("timer").innerText = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function shuffle() {
            playClick();
            tiles = Array.from({length: size * size - 1}, (_, i) => i + 1).concat("");
            
            for (let i = 0; i < 350; i++) {
                const emptyIndex = tiles.indexOf("");
                const row = Math.floor(emptyIndex / size), col = emptyIndex % size;
                const validMoves = [];
                if (row > 0) validMoves.push(emptyIndex - size);
                if (row < size - 1) validMoves.push(emptyIndex + size);
                if (col > 0) validMoves.push(emptyIndex - 1);
                if (col < size - 1) validMoves.push(emptyIndex + 1);
                
                const randomMove = validMoves[Math.floor(Math.random() * validMoves.length)];
                [tiles[emptyIndex], tiles[randomMove]] = [tiles[randomMove], tiles[emptyIndex]];
            }

            moveCount = 0;
            document.getElementById("moves").innerText = moveCount;
            render();
            gameActive = true;
            startTimer();
        }

        function checkWin() {
            const win = tiles.slice(0, -1).every((tile, i) => tile === i + 1);
            if (win && tiles[tiles.length - 1] === "") {
                clearInterval(timerInterval);
                gameActive = false;
                
                const elapsedTime = Date.now() - startTime;
                const timeSec = Math.floor(elapsedTime / 1000);
                let score = 100000 - (timeSec * 50) - (moveCount * 20);
                if (score < 1000) score = 1000;

                document.getElementById("final-time").innerText = document.getElementById("timer").innerText;
                document.getElementById("final-moves").innerText = moveCount;
                document.getElementById("final-score").innerText = score.toLocaleString() + " Poin";
                document.getElementById("win-modal").style.display = "flex";
            }
        }

        function closeModal() {
            document.getElementById("win-modal").style.display = "none";
        }

        render();
    </script>
</body>
</html>
